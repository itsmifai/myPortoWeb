<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miftahul Amri — Web Developer & AI Enthusiast</title>
<meta name="description" content="Portofolio resmi Miftahul Amri — Web Developer & AI Enthusiast dari Surakarta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --v: #5b2ff0;
  --v2: #8b5cf6;
  --lilac: #cdb9f5;
  --ink: #1c1733;
  --mut: #6f6b88;
  --bg: #f3effe;
  --ib: #0d0826;
  --im: #a9a2cf;
  --il: rgba(255, 255, 255, 0.09);
  --card-bg: #18123f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  width: 100%;
}
body {
  font-family: "Plus Jakarta Sans", system-ui, sans-serif;
  font-size: 13.5px;
  color: var(--ink);
  background-color: var(--bg);
  background-image: radial-gradient(rgba(91, 47, 240, 0.16) 1.2px, transparent 1.4px);
  background-size: 26px 26px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
a { color: inherit; text-decoration: none; }
button, textarea, input { font-family: inherit; }
:focus-visible { outline: 2px solid var(--v2); outline-offset: 2px; }

/* Ambient Glow & Shapes */
.glow {
  position: fixed;
  left: 50%;
  top: 50%;
  width: min(920px, 130vw);
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(139, 92, 246, 0.28), transparent);
  pointer-events: none;
  z-index: 0;
}
.deco { position: fixed; pointer-events: none; opacity: 0.55; z-index: 1; }

/* Top Header Bar */
.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 40;
}
.brand-lg {
  font-weight: 800;
  font-size: 17px;
  letter-spacing: -0.03em;
  color: var(--ink);
}
.brand-lg b { color: var(--v); }

/* Language Switcher Pill */
.lang-pill {
  display: flex;
  align-items: center;
  gap: 2px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(25, 13, 75, 0.1);
  padding: 3px;
  border-radius: 999px;
  box-shadow: 0 4px 14px rgba(25, 13, 75, 0.05);
}
.lang-btn {
  border: 0;
  background: transparent;
  color: var(--mut);
  font: 700 11px "Plus Jakarta Sans", sans-serif;
  padding: 4px 10px;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s ease;
}
.lang-btn.active {
  background: var(--v);
  color: #ffffff;
  box-shadow: 0 2px 8px rgba(91, 47, 240, 0.3);
}

/* ==============================================
   DYNAMIC ISLAND CONTAINER
   ============================================== */
.isw {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  padding: 24px;
  z-index: 30;
}
.isl {
  position: relative;
  width: 250px;
  height: 56px;
  background: var(--ib);
  color: #fff;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(13, 8, 38, 0.42), 0 0 0 1px rgba(255, 255, 255, 0.1);
  cursor: pointer;
  transition: width 0.55s cubic-bezier(0.2, 0.9, 0.25, 1.1),
              height 0.55s cubic-bezier(0.2, 0.9, 0.25, 1.1),
              border-radius 0.45s;
}
.isl.open {
  width: min(720px, calc(100vw - 24px));
  height: min(530px, calc(100vh - 120px));
  border-radius: 36px;
  cursor: default;
}

/* Collapsed Mini Island */
.mini {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
  transition: opacity 0.2s;
  padding: 0 16px;
}
.isl.open .mini {
  opacity: 0;
  pointer-events: none;
}
.mini-av {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.3);
  flex-shrink: 0;
}
.mini-av img { width: 100%; height: 100%; object-fit: cover; }
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  animation: pl 2s infinite;
  flex-shrink: 0;
}
@keyframes pl {
  70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
}

/* Expanded Full Island */
.full {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.isl.open .full {
  opacity: 1;
  pointer-events: auto;
  transition: opacity 0.3s 0.18s;
}

/* Island Close / Minimize Button */
.isl-close {
  position: absolute;
  top: 14px;
  right: 16px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid var(--il);
  background: rgba(255, 255, 255, 0.08);
  color: var(--im);
  font-size: 16px;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: all 0.2s;
  z-index: 10;
}
.isl-close:hover {
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
}

/* Navigation Tabs */
.tabs {
  display: flex;
  gap: 4px;
  padding: 14px 46px 0 16px;
  overflow-x: auto;
  scrollbar-width: none;
  flex: none;
  justify-content: flex-start;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0;
  background: none;
  color: var(--im);
  font: 700 12.5px "Plus Jakarta Sans", sans-serif;
  padding: 7px 13px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s, color 0.2s;
}
.tab:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
.tab[aria-selected="true"] {
  background: #fff;
  color: var(--ib);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
}

/* Viewport Carousel */
.vp {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  touch-action: pan-y;
  margin-top: 6px;
}
.tr {
  display: flex;
  height: 100%;
  transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sl {
  flex: none;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  padding: 14px 26px 24px;
  scrollbar-width: thin;
  scrollbar-color: #3a2f78 transparent;
  user-select: none;
  -webkit-user-select: none;
}
.sl textarea, .sl input { user-select: text; -webkit-user-select: text; }

/* Pagination Dots */
.pg {
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 0 0 12px;
  flex: none;
}
.pg i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--il);
  transition: all 0.3s;
}
.pg i.on {
  width: 18px;
  border-radius: 3px;
  background: var(--v2);
}

/* Slide Content Styles */
.sl h2 { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.2; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span {
  font-size: 11px;
  font-weight: 600;
  color: #cfc8f0;
  background: var(--il);
  padding: 3px 10px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

/* 1. TENTANG SLIDE */
.ab { display: flex; align-items: center; gap: 14px; }
.ab-av {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid rgba(255, 255, 255, 0.25);
  flex-shrink: 0;
}
.ab-av img { width: 100%; height: 100%; object-fit: cover; }
.abn { flex: 1; min-width: 0; }
.abn h2 { font-size: 19px; }
.abn span { display: block; color: var(--im); font-size: 12.5px; line-height: 1.4; }
.flag-svg {
  display: inline-block;
  vertical-align: middle;
  width: 15px;
  height: 10px;
  border-radius: 2px;
  overflow: hidden;
  margin-left: 4px;
}
.rw { display: flex; gap: 5px; flex-shrink: 0; }
.rw a {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--il);
  display: grid;
  place-items: center;
  color: #e6e1fa;
  transition: all 0.2s;
}
.rw a:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
.rw svg { width: 15px; height: 15px; }
.rw .cvl {
  width: auto;
  padding: 0 12px;
  font-weight: 700;
  font-size: 12px;
  border-radius: 999px;
}
.hl { margin-top: 16px; font-size: 22px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25; }
.hl em { font-style: normal; color: var(--v2); }
.bio { margin-top: 8px; color: #cfc8f0; line-height: 1.6; max-width: 60ch; font-size: 13px; }
.lh { margin: 16px 0 8px; font-size: 11.5px; font-weight: 800; color: var(--v2); text-transform: uppercase; letter-spacing: 0.05em; }
.lv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.la {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: var(--card-bg);
  border: 1px solid var(--il);
  border-radius: 16px;
  padding: 11px 12px;
}
.la b { display: block; font-size: 12px; line-height: 1.3; }
.la small { display: block; font-size: 11px; color: var(--im); line-height: 1.4; }
.la small.s { color: #6ee7a8; margin-top: 3px; font-weight: 600; }
.lr {
  position: relative;
  flex: none;
  width: 8px;
  height: 8px;
  margin-top: 4px;
  border-radius: 50%;
  background: #22c55e;
}
.lr:after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid #22c55e;
  animation: rg 2s infinite;
}
@keyframes rg {
  from { transform: scale(1); opacity: 0.55; }
  to { transform: scale(1.75); opacity: 0; }
}

/* 2. PROYEK SLIDE (Interactive Card Stack) */
.dkw { display: grid; grid-template-columns: 1fr 32px; gap: 12px; height: 100%; }
.dk { position: relative; min-height: 310px; touch-action: none; }
.dc {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 290px;
  display: flex;
  gap: 16px;
  padding: 14px;
  background: var(--card-bg);
  border: 1px solid var(--il);
  border-radius: 20px;
  box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
  transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s;
}
.dc .th {
  flex: 1.15;
  height: 100%;
  min-width: 0;
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  background: #110b2e;
  border: 1px solid var(--il);
  display: flex;
  align-items: center;
  justify-content: center;
}
.dc .th img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}
.dt {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  padding: 4px 6px 4px 0;
}
.dt h3 { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.25; }
.dt p { font-size: 12px; color: var(--im); line-height: 1.5; }
.go {
  align-self: flex-start;
  font-weight: 700;
  font-size: 12px;
  color: var(--ib);
  background: #fff;
  padding: 7px 15px;
  border-radius: 999px;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.go:hover { background: var(--lilac); }
.dn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.dn button {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--il);
  background: none;
  color: #fff;
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.dn button:hover { background: rgba(255, 255, 255, 0.15); }
.dd { display: flex; flex-direction: column; gap: 5px; }
.dd i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--il);
  transition: all 0.3s;
}
.dd i.on {
  height: 16px;
  border-radius: 3px;
  background: var(--v2);
}

/* 3. PENGALAMAN SLIDE (Timeline Gantt) */
.gt { display: grid; grid-template-columns: 180px 1fr; margin-top: 4px; }
.gcl > div {
  height: 27px;
  line-height: 27px;
  font-size: 11.5px;
  font-weight: 600;
  color: #d9d3f3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-right: 10px;
}
.gcl > div:first-child { height: 22px; }
.gp {
  position: relative;
  background-image: linear-gradient(to right, var(--il) 1px, transparent 1px);
  background-size: 25% 100%;
  border-right: 1px solid var(--il);
}
.ax { position: relative; height: 22px; font-size: 10.5px; color: var(--im); font-family: "JetBrains Mono", monospace; }
.ax span { position: absolute; top: 2px; padding-left: 5px; }
.ax span:last-child { transform: translateX(-100%); padding: 0 5px 0 0; }
.gb { position: relative; height: 27px; }
.bar-track {
  position: absolute;
  top: 6px;
  height: 15px;
  border-radius: 7px;
  background: var(--c);
  transform-origin: left;
  transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sl:not(.act) .bar-track { transform: scaleX(0); transition: none; }
.sl.act .bar-track { transition-delay: calc(var(--k) * 60ms + 0.15s); }
.now-line {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 95.5%;
  border-left: 1px dashed #6ee7a8;
}
.lgd { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; font-size: 11px; color: var(--im); }
.lgd i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

/* 4. PENDIDIKAN SLIDE (Step Ladder) */
.st2 { display: flex; align-items: flex-end; gap: 10px; height: 320px; }
.stp {
  position: relative;
  flex: 1;
  min-width: 0;
  height: var(--h);
  border-radius: 20px 20px 8px 8px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 3px;
  background: linear-gradient(180deg, #241a5c, #18123f);
  border: 1px solid var(--il);
  overflow: hidden;
  transition: height 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s;
  transition-delay: calc(var(--k) * 0.15s + 0.1s);
}
.sl:not(.act) .stp { height: 34px; opacity: 0; transition: none; }
.stp small { font-size: 11px; color: var(--im); line-height: 1.35; }
.stp b { font-size: 13.5px; line-height: 1.3; }
.stp .yr { font-size: 18px; font-weight: 800; letter-spacing: -0.03em; color: var(--lilac); margin-top: 4px; }
.stp.cur { background: linear-gradient(180deg, #6d3df5, #4a22c9); border-color: transparent; }
.stp.cur small { color: #e0d6ff; }
.stp.cur .yr { color: #fff; }
.nw {
  position: absolute;
  top: 12px;
  left: 14px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: rgba(255, 255, 255, 0.18);
  padding: 3px 10px;
  border-radius: 999px;
}
.nw:before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }

/* 5. SERTIFIKAT SLIDE (Ticket Stubs) */
.tk {
  position: relative;
  display: grid;
  grid-template-columns: 95px 1fr 65px;
  background: var(--card-bg);
  border: 1px solid var(--il);
  border-radius: 16px;
  margin-bottom: 10px;
  overflow: hidden;
  align-items: center;
}
.tk:before, .tk:after {
  content: "";
  position: absolute;
  left: 88px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--ib);
}
.tk:before { top: -7px; }
.tk:after { bottom: -7px; }
.tk .y {
  display: grid;
  place-items: center;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--lilac);
  border-right: 2px dashed rgba(255, 255, 255, 0.15);
  height: 100%;
}
.tk .tb { padding: 14px 16px; }
.tk b { display: block; font-size: 13.5px; line-height: 1.35; }
.tk small { color: var(--im); font-size: 11.5px; }
.tk .pdf-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 0;
  color: #fff;
  font-weight: 700;
  font-size: 11px;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  margin-right: 14px;
  transition: all 0.2s;
}
.tk .pdf-btn:hover { background: #fff; color: var(--ib); }

/* 6. KONTAK SLIDE (Call / Dispatch) */
.cl { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; padding: 6px 0 0; }
.cl h2 { font-size: 18px; }
.cl .st { font-size: 11.5px; color: #6ee7a8; }
.nd { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.nd button {
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: none;
  color: #fff;
  border-radius: 999px;
  padding: 5px 12px;
  font: 600 12px "Plus Jakarta Sans", sans-serif;
  cursor: pointer;
  transition: all 0.2s;
}
.nd button[aria-pressed="true"] { background: #fff; color: var(--ib); border-color: #fff; }
.tx2 {
  width: 100%;
  background: var(--il);
  border: 1px solid rgba(255, 255, 255, 0.08);
  outline: 0;
  resize: none;
  border-radius: 14px;
  color: #fff;
  font: 500 13px "Plus Jakarta Sans", sans-serif;
  padding: 10px 14px;
  min-height: 56px;
}
.tx2::placeholder { color: #8b84b5; }
.call {
  width: 100%;
  margin-top: 10px;
  border: 0;
  border-radius: 14px;
  background: #22c55e;
  color: #04210f;
  font: 800 13.5px "Plus Jakarta Sans", sans-serif;
  padding: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
}
.call:hover { background: #4ade80; }
.call svg { width: 17px; height: 17px; }
.sub { margin-top: 8px; color: var(--im); font-size: 11.5px; text-align: center; }

/* Interactive Hint */
.hint {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 60px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--mut);
  transition: opacity 0.5s;
  pointer-events: none;
  z-index: 10;
}
.hint.off { opacity: 0; }

/* Bottom Footer (Required Strict Wording) */
.ftr {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 10px 16px 14px;
  text-align: center;
  font-size: 11.5px;
  color: var(--mut);
  border-top: 1px solid rgba(25, 13, 75, 0.08);
  background: rgba(243, 239, 254, 0.85);
  backdrop-filter: blur(12px);
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.ftr-sub { font-size: 10.5px; color: #8882a8; }
.yapp-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: #7b759e;
  margin-top: 2px;
  transition: color 0.2s;
}
.yapp-link:hover { color: var(--v); }

/* PDF Preview Modal */
.pdf-modal {
  position: fixed;
  inset: 0;
  z-index: 99;
  background: rgba(13, 8, 38, 0.75);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.pdf-modal.open { opacity: 1; pointer-events: auto; }
.pdf-box {
  background: #ffffff;
  border-radius: 20px;
  width: 100%;
  max-width: 800px;
  height: 80vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
}
.pdf-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: #faf8fd;
  border-bottom: 1px solid var(--il);
}

        ${[...c.edu].reverse().map((e, i) => {
          const [nm, yr] = e[1].split(" · ");
          const heights = [130, 190, 260];
          return `
            <div class="stp ${i === 2 ? 'cur' : ''}" style="--h:${heights[i]}px;--k:${i}">
              ${i === 2 ? `<span class="nw">${c.nowLabel}</span>` : ""}
              <small>${esc(e[0])}</small>
              <b>${esc(nm)}</b>
              <span class="yr">${esc(yr)}</span>
            </div>
          `;
        }).join("")}
      </div>
    `,

    // Slide 4: Sertifikat
    () => c.certs.map((ct, i) => `
      <div class="tk">
        <div class="y">${ct[0]}</div>
        <div class="tb">
          <b>${esc(ct[1])}</b>
          <small>${esc(ct[2])}</small>
        </div>
        <button class="pdf-btn" type="button" onclick="openPdf('${ct[3]}', '${esc(ct[1])}')">PDF</button>
      </div>
    `).join(""),

    // Slide 5: Kontak
    () => `
      <div class="cl">
        <div>
          <h2>${esc(c.contactHeading)}</h2>
          <span class="st">${esc(c.contactSub)}</span>
        </div>
      </div>
      <div class="nd" id="nd">
        ${c.needs.map(n => `<button type="button" aria-pressed="false">${esc(n)}</button>`).join("")}
      </div>
      <textarea class="tx2" id="txt" placeholder="${esc(c.contactPlaceholder)}" aria-label="Message"></textarea>
      <button class="call" id="send" type="button">
        ${icons.wa} ${esc(c.contactBtn)}
      </button>
      <p class="sub">${esc(c.contactEmailAlt)}</p>
    `
  ];

  $("tr").innerHTML = slideTemplates.map(fn => `<section class="sl">${fn()}</section>`).join("");
  $("pg").innerHTML = slideTemplates.map(() => "<i></i>").join("");
  $("pg").querySelectorAll("i").forEach((dot, k) => {
    dot.style.cursor = "pointer";
    dot.title = c.tabs[k];
    dot.onclick = () => goToSlide(k);
  });

  attachSlideEvents();
  goToSlide(slideIdx);
  deckGo(deckIdx);
}

/* ==============================================================
   INTERACTIONS & LOGIC
   ============================================================== */
const isl = $("isl"), isw = $("isw"), tr = $("tr"), vp = $("vp"), hint = $("hint");
let closeTimer;
let isPinned = false;

function setOpen(isOpen) {
  clearTimeout(closeTimer);
  if (!isOpen) isPinned = false;
  isl.classList.toggle("open", isOpen);
  isl.setAttribute("aria-expanded", isOpen);
  isl.setAttribute("aria-label", isOpen ? "Portofolio Miftahul Amri" : "Buka portofolio Miftahul Amri");
  if (isOpen) {
    hint.classList.add("off");
    const activeSlide = document.querySelectorAll(".sl")[slideIdx];
    if (activeSlide) {
      activeSlide.classList.remove("act");
      void activeSlide.offsetWidth;
      activeSlide.classList.add("act");
    }
  }
}

const isDesktopFine = matchMedia("(hover:hover) and (pointer:fine)").matches;
if (isDesktopFine) {
  isw.addEventListener("pointerenter", () => setOpen(true));
  isw.addEventListener("pointerleave", () => {
    if (isPinned) return;
    closeTimer = setTimeout(() => {
      if (!isDragging && !isPinned) setOpen(false);
    }, 450);
  });
}

isl.addEventListener("click", () => {
  isPinned = true;
  if (!isl.classList.contains("open")) setOpen(true);
});

document.addEventListener("pointerdown", e => {
  if (!isw.contains(e.target) && !$("pdf-modal").contains(e.target)) {
    isPinned = false;
    setOpen(false);
  }
});

isl.addEventListener("keydown", e => {
  if (!isl.classList.contains("open")) {
    if (e.target === isl && (e.key === "Enter" || e.key === " ")) {
      e.preventDefault();
      isPinned = true;
      setOpen(true);
    }
    return;
  }
  if (e.key === "Escape") { isPinned = false; setOpen(false); isl.focus(); }
  if (e.key === "ArrowRight") goToSlide(slideIdx + 1);
  if (e.key === "ArrowLeft") goToSlide(slideIdx - 1);
});

function goToSlide(i) {
  slideIdx = Math.max(0, Math.min(content[lang].tabs.length - 1, i));
  tr.style.transition = "";
  tr.style.transform = `translateX(${-slideIdx * 100}%)`;

  document.querySelectorAll(".tab").forEach((t, k) => {
    t.setAttribute("aria-selected", k === slideIdx);
    if (k === slideIdx) t.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  });
  document.querySelectorAll(".pg i").forEach((d, k) => d.classList.toggle("on", k === slideIdx));
  document.querySelectorAll(".sl").forEach((s, k) => s.classList.toggle("act", k === slideIdx));
}

$("tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (t) goToSlide(+t.dataset.i);
});

/* Touch / Drag Gesture on Island Carousel */
let isDragging = false, startX = 0, startY = 0, deltaX = 0, timeStart = 0, isArmed = false, justSwiped = false;

vp.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button) return;
  isArmed = true;
  isDragging = false;
  startX = e.clientX;
  startY = e.clientY;
  deltaX = 0;
  timeStart = performance.now();
});

vp.addEventListener("pointermove", e => {
  if (!isArmed) return;
  const mx = e.clientX - startX, my = e.clientY - startY;
  if (!isDragging && Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) {
    isDragging = true;
    vp.setPointerCapture(e.pointerId);
    tr.style.transition = "none";
  }
  if (isDragging) {
    deltaX = mx;
    const isEdge = (slideIdx === 0 && deltaX > 0) || (slideIdx === content[lang].tabs.length - 1 && deltaX < 0);
    tr.style.transform = `translateX(calc(${-slideIdx * 100}% + ${isEdge ? deltaX * 0.25 : deltaX}px))`;
  }
});

const finishDrag = () => {
  if (!isArmed) return;
  isArmed = false;
  if (isDragging) {
    const velocity = deltaX / Math.max(1, performance.now() - timeStart);
    const width = vp.clientWidth;
    justSwiped = true;
    setTimeout(() => justSwiped = false, 0);
    isDragging = false;
    goToSlide(slideIdx + (deltaX < -width * 0.16 || velocity < -0.5 ? 1 : deltaX > width * 0.16 || velocity > 0.5 ? -1 : 0));
  }
};

vp.addEventListener("pointerup", finishDrag);
vp.addEventListener("pointercancel", finishDrag);
vp.addEventListener("click", e => {
  if (justSwiped) { e.preventDefault(); e.stopPropagation(); }
}, true);

/* Project Card Deck */
function deckGo(n) {
  const cards = [...document.querySelectorAll(".dc")];
  const dots = [...document.querySelectorAll(".dd i")];
  if (!cards.length) return;
  deckIdx = Math.max(0, Math.min(cards.length - 1, n));

  cards.forEach((c, i) => {
    const o = i - deckIdx;
    c.style.transform = o < 0 ? "translateY(-115%) scale(0.9)" : `translateY(${[0, 16, 30, 42][Math.min(o, 3)]}px) scale(${[1, 0.95, 0.9, 0.85][Math.min(o, 3)]})`;
    c.style.opacity = o < 0 || o > 2 ? 0 : [1, 0.75, 0.5][o];
    c.style.zIndex = 50 - Math.abs(o);
    c.style.pointerEvents = (o >= 0 && o <= 2) ? "auto" : "none";
    c.style.cursor = o === 0 ? "default" : "pointer";
    c.onclick = (e) => {
      if (i !== deckIdx) {
        e.stopPropagation();
        deckGo(i);
      }
    };
  });

  dots.forEach((d, i) => {
    d.style.cursor = "pointer";
    d.onclick = () => deckGo(i);
    d.classList.toggle("on", i === deckIdx);
  });
}

function attachSlideEvents() {
  const dup = $("dup"), ddn = $("ddn");
  if (dup) dup.onclick = () => deckGo(deckIdx - 1);
  if (ddn) ddn.onclick = () => deckGo(deckIdx + 1);

  const dkEl = $("dk");
  if (dkEl) {
    let dy0 = null, dx0 = 0;
    dkEl.addEventListener("pointerdown", e => { dy0 = e.clientY; dx0 = e.clientX; });
    dkEl.addEventListener("pointermove", e => {
      if (dy0 === null) return;
      const dy = e.clientY - dy0, dx = e.clientX - dx0;
      if (Math.abs(dy) > 36 && Math.abs(dy) > Math.abs(dx)) {
        deckGo(deckIdx + (dy < 0 ? 1 : -1));
        dy0 = null;
      }
    });
    ["pointerup", "pointercancel"].forEach(ev => dkEl.addEventListener(ev, () => dy0 = null));
  }

  // Contact Chips
  const nd = $("nd");
  if (nd) {
    nd.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      const isPressed = b.getAttribute("aria-pressed") === "true";
      nd.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", String(!isPressed));
      selectedNeed = isPressed ? "" : b.textContent;
    });
  }

  // Contact WhatsApp Send
  const sendBtn = $("send");
  if (sendBtn) {
    sendBtn.onclick = () => {
      const txtVal = $("txt") ? $("txt").value.trim() : "";
      let msg = "";
      if (lang === 'en') {
        msg = `Hello Miftahul Amri, I am interested in collaborating on: *${selectedNeed || "Web Development / AI"}*.`;
        if (txtVal) msg += `\n\nNote:\n"${txtVal}"`;
        msg += `\n\nSent from your dynamic island portfolio.`;
      } else {
        msg = `Halo Miftahul Amri, saya tertarik berdiskusi mengenai proyek: *${selectedNeed || "Bantuan Proyek Web"}*.`;
        if (txtVal) msg += `\n\nCatatan:\n"${txtVal}"`;
        msg += `\n\nDikirim dari portofolio web.`;
      }
      window.open(`https://wa.me/${WA_PHONE}?text=${encodeURIComponent(msg)}`, "_blank", "noopener");
    };
  }
}

/* Language Selection */
function setLang(newLang) {
  lang = newLang;
  localStorage.setItem('portfolio_lang', lang);
  document.documentElement.lang = lang;

  $("btn-id").classList.toggle("active", lang === 'id');
  $("btn-en").classList.toggle("active", lang === 'en');

  renderAll();
}

/* PDF Modal */
const pdfModal = $("pdf-modal");
const pdfFrame = $("pdf-frame");
const pdfTitle = $("pdf-title");
const pdfDirect = $("pdf-direct");

function openPdf(url, title) {
  if (!pdfModal || !pdfFrame) return;
  pdfFrame.src = url;
  if (pdfTitle) pdfTitle.textContent = title;
  if (pdfDirect) pdfDirect.href = url;
  pdfModal.classList.add("open");
}

function closePdf() {
  if (!pdfModal || !pdfFrame) return;
  pdfModal.classList.remove("open");
  pdfFrame.src = "";
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && pdfModal && pdfModal.classList.contains("open")) {
    closePdf();
  }
});

/* Boot Initializer */
setLang(lang);
</script>
