<style>
:root {
  --bg: #111111;
  --bg-subtle: #191919;
  --fg: #ededed;
  --fg-muted: #888888;
  --fg-subtle: #555555;
  --border: rgba(255, 255, 255, 0.06);
  --border-hover: rgba(255, 255, 255, 0.22);
  --underline: rgba(255, 255, 255, 0.25);
  --underline-hover: #ffffff;
  --selection: rgba(255, 255, 255, 0.18);
  --green: #22c55e;
  --modal-overlay: rgba(0, 0, 0, 0.85);
  --max-w: 680px;
  --label-w: 160px;
}

html.light {
  --bg: #fafafa;
  --bg-subtle: #f0f0f0;
  --fg: #111111;
  --fg-muted: #666666;
  --fg-subtle: #999999;
  --border: rgba(0, 0, 0, 0.06);
  --border-hover: rgba(0, 0, 0, 0.25);
  --underline: rgba(0, 0, 0, 0.22);
  --underline-hover: #111111;
  --selection: rgba(0, 0, 0, 0.10);
  --modal-overlay: rgba(0, 0, 0, 0.55);
}

/* View Transition API Circular Wave */
::view-transition-old(root),
::view-transition-new(root) {
  animation: none;
  mix-blend-mode: normal;
}
::view-transition-old(root) {
  z-index: 1;
}
::view-transition-new(root) {
  z-index: 9999;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
::selection { background: var(--selection); }

html {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.7;
  color: var(--fg);
  background-color: var(--bg);
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

a {
  color: inherit;
  text-decoration: none;
  transition: color 0.15s ease, text-decoration-color 0.15s ease;
}

.u-link {
  text-decoration: underline;
  text-decoration-color: var(--underline);
  text-underline-offset: 3px;
  transition: text-decoration-color 0.15s ease, color 0.15s ease;
}
.u-link:hover {
  text-decoration-color: var(--underline-hover);
  color: var(--fg);
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
  padding: 0;
}

.mono {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px;
}

.serif-italic {
  font-family: "Newsreader", Georgia, serif;
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.01em;
}

/* Layout Container — narrow like paco.me */
.container {
  max-width: var(--max-w);
  width: 100%;
  margin: 0 auto;
  padding: 0 24px;
}

/* Header */
.header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}
.header.scrolled {
  border-bottom-color: var(--border);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
}
.brand {
  font-size: 13px;
  font-weight: 500;
  color: var(--fg-muted);
  letter-spacing: -0.01em;
  transition: color 0.15s;
}
.brand:hover {
  color: var(--fg);
}
.nav-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Language Toggle */
.lang-toggle {
  display: inline-flex;
  align-items: center;
  padding: 2px;
  border-radius: 999px;
  border: 1px solid var(--border);
}
.lang-btn {
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-muted);
  transition: all 0.15s ease;
}
.lang-btn.active {
  background: var(--fg);
  color: var(--bg);
}

/* Theme Button */
.theme-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  color: var(--fg-muted);
  transition: all 0.15s ease;
}
.theme-btn:hover {
  color: var(--fg);
  border-color: var(--border-hover);
}
.theme-btn svg {
  width: 13px;
  height: 13px;
}

/* Main Content Area */
main {
  flex: 1;
  padding-top: 72px;
  padding-bottom: 120px;
}

/* ============================
   HERO — paco.me style
   Clean name + short intro
   ============================ */
.hero {
  margin-bottom: 80px;
}
.hero-name {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--fg);
  margin-bottom: 20px;
}
.hero-bio {
  font-size: 14px;
  color: var(--fg-muted);
  line-height: 1.75;
  max-width: 520px;
}
.hero-bio + .hero-bio {
  margin-top: 12px;
}
.flag-icon {
  display: inline-block;
  vertical-align: -1px;
  width: 13px;
  height: 9px;
  border-radius: 1.5px;
  overflow: hidden;
  margin: 0 1px;
}

/* ============================
   SECTION — 2-col asymmetric
   Label left (160px) + content right
   Stacked vertically per section
   ============================ */
.section {
  margin-bottom: 64px;
}
.section:last-child {
  margin-bottom: 0;
}

.section-row {
  display: grid;
  grid-template-columns: var(--label-w) 1fr;
  gap: 0 32px;
}

.section-label {
  font-size: 13px;
  font-weight: 400;
  color: var(--fg-muted);
  padding-top: 1px;
  letter-spacing: -0.005em;
}

.section-content {
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* Entry items — each row */
.entry {
  padding: 10px 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.entry-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--fg);
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
}
.entry-title.clickable {
  cursor: pointer;
}
.entry-title.static {
  cursor: default;
}
.entry-desc {
  font-size: 13px;
  color: var(--fg-muted);
  line-height: 1.6;
}

/* Role entry with pulse dot */
.role-entry {
  padding: 10px 0;
  display: flex;
  align-items: flex-start;
  gap: 10px;
}
.role-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* Pulse dot for live items */
.pulse-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4);
  animation: pulseGreen 2.4s infinite;
  flex-shrink: 0;
  margin-top: 7px;
}
@keyframes pulseGreen {
  0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
  70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
  100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

/* Separator line between sections */
.section-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin: 0 0 64px 0;
}

/* ============================
   IN-SITE PROJECT DETAIL VIEW
   ============================ */
.project-detail-view {
  display: none;
  animation: fadeIn 0.25s ease-out;
}
.project-detail-view.active {
  display: block;
}
.main-view.hidden {
  display: none;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--fg-muted);
  margin-bottom: 32px;
  cursor: pointer;
  padding: 4px 0;
  transition: color 0.15s;
}
.back-btn:hover {
  color: var(--fg);
}
.detail-banner {
  width: 100%;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  background: #000;
  margin-bottom: 32px;
}
.detail-banner img {
  width: 100%;
  max-height: 400px;
  object-fit: cover;
  object-position: top center;
  display: block;
}
.detail-title {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.025em;
  color: var(--fg);
  margin-bottom: 6px;
}
.detail-subtitle {
  font-size: 13px;
  color: var(--fg-muted);
  margin-bottom: 20px;
}
.detail-desc {
  font-size: 14px;
  color: var(--fg-muted);
  line-height: 1.75;
  margin-bottom: 24px;
}
.detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 28px;
}
.detail-tag {
  font-size: 11px;
  color: var(--fg-muted);
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 4px;
}
.detail-action-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--fg);
  padding-bottom: 1px;
  border-bottom: 1px solid var(--underline);
  transition: border-color 0.15s, opacity 0.15s;
}
.detail-action-btn:hover {
  border-bottom-color: var(--fg);
}

/* ============================
   FOOTER
   ============================ */
.footer {
  border-top: 1px solid var(--border);
  padding: 40px 0 56px;
  text-align: center;
  font-size: 12px;
  color: var(--fg-muted);
  line-height: 1.9;
}
.footer a {
  color: var(--fg-muted);
  transition: color 0.15s;
}
.footer a:hover {
  color: var(--fg);
}
.footer-support {
  margin-top: 4px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--fg-muted);
}
.footer-support:hover {
  color: var(--fg);
}

/* Certificate PDF Preview Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--modal-overlay);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}
.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}
.modal-dialog {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 100%;
  max-width: 820px;
  height: 82vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
}
.modal-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--fg);
}
.modal-header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.modal-link {
  font-size: 12px;
  color: var(--fg-muted);
}
.modal-link:hover { color: var(--fg); }
.modal-close {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--fg-muted);
  border: 1px solid var(--border);
  transition: all 0.15s;
}
.modal-close:hover {
  color: var(--fg);
  border-color: var(--border-hover);
}
.modal-frame {
  flex: 1;
  width: 100%;
  border: none;
  background: #111;
}

/* ============================
   RESPONSIVE
   ============================ */
@media (max-width: 600px) {
  .section-row {
    grid-template-columns: 1fr;
    gap: 8px 0;
  }
  .section-label {
    font-size: 12px;
  }
  .container {
    padding: 0 20px;
  }
  main {
    padding-top: 48px;
    padding-bottom: 80px;
  }
  .hero {
    margin-bottom: 56px;
  }
  .section {
    margin-bottom: 48px;
  }
  .section-divider {
    margin-bottom: 48px;
  }
}
</style>

/* ==============================================================

   ============================================================== */
let currentSlug = null;

function openProjectDetail(slug) {
  const p = projectsData.find(x => x.slug === slug);
  if (!p) return;

  currentSlug = slug;
  window.location.hash = `project/${slug}`;

  document.getElementById('detail-title').textContent = p.title;
  document.getElementById('detail-subtitle').textContent = lang === 'id' ? p.subId : p.subEn;
  document.getElementById('detail-desc').textContent = lang === 'id' ? p.descId : p.descEn;
  document.getElementById('detail-img').src = p.img;
  document.getElementById('detail-img').alt = p.title;
  document.getElementById('detail-link').href = p.link;
  document.getElementById('detail-tags').innerHTML = p.tags.map(t => `<span class="detail-tag mono">${esc(t)}</span>`).join('');

  document.getElementById('main-view').classList.add('hidden');
  document.getElementById('project-detail-view').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showHome(e) {
  if (e) e.preventDefault();
  currentSlug = null;
  if (window.location.hash.startsWith('#project/')) {
    history.pushState(null, '', window.location.pathname + window.location.search);
  }
  document.getElementById('project-detail-view').classList.remove('active');
  document.getElementById('main-view').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Browser Back / Forward support
window.addEventListener('popstate', () => {
  const hash = window.location.hash;
  if (hash.startsWith('#project/')) {
    const slug = hash.replace('#project/', '');
    openProjectDetail(slug);
  } else {
    document.getElementById('project-detail-view').classList.remove('active');
    document.getElementById('main-view').classList.remove('hidden');
  }
});

/* ==============================================================
   THEME CONTROLLER (Silky Circular Ripple Wave)
   ============================================================== */
function applyTheme(t) {
  theme = t;
  localStorage.setItem('portfolio_theme', theme);
  const root = document.documentElement;
  const sun = document.getElementById('theme-sun');
  const moon = document.getElementById('theme-moon');

  if (theme === 'light') {
    root.classList.remove('dark');
    root.classList.add('light');
    if (sun) sun.style.display = 'none';
    if (moon) moon.style.display = 'block';
  } else {
    root.classList.remove('light');
    root.classList.add('dark');
    if (sun) sun.style.display = 'block';
    if (moon) moon.style.display = 'none';
  }
}

function toggleTheme(event) {
  const nextTheme = theme === 'dark' ? 'light' : 'dark';

  if (!document.startViewTransition || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    applyTheme(nextTheme);
    return;
  }

  const btn = document.getElementById('theme-btn');
  let x, y;
  if (btn) {
    const rect = btn.getBoundingClientRect();
    x = rect.left + rect.width / 2;
    y = rect.top + rect.height / 2;
  } else if (event) {
    x = event.clientX;
    y = event.clientY;
  } else {
    x = window.innerWidth - 40;
    y = 30;
  }

  const endRadius = Math.hypot(
    Math.max(x, window.innerWidth - x),
    Math.max(y, window.innerHeight - y)
  );

  const transition = document.startViewTransition(() => {
    applyTheme(nextTheme);
  });

  transition.ready.then(() => {
    const clipPath = [
      `circle(0px at ${x}px ${y}px)`,
      `circle(${endRadius}px at ${x}px ${y}px)`
    ];
    document.documentElement.animate(
      {
        clipPath: clipPath
      },
      {
        duration: 750,
        easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
        pseudoElement: '::view-transition-new(root)'
      }
    );
  });
}

/* ==============================================================
   PDF MODAL CONTROLLER
   ============================================================== */
const pdfModal = document.getElementById('pdf-modal');
const pdfFrame = document.getElementById('pdf-frame');
const pdfTitle = document.getElementById('pdf-title');
const pdfDirect = document.getElementById('pdf-direct');

function openPdf(file, title) {
  if (pdfTitle) pdfTitle.textContent = title;
  if (pdfFrame) pdfFrame.src = file;
  if (pdfDirect) pdfDirect.href = file;
  if (pdfModal) pdfModal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closePdf() {
  if (pdfModal) pdfModal.classList.remove('active');
  if (pdfFrame) pdfFrame.src = '';
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === pdfModal) closePdf();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (pdfModal && pdfModal.classList.contains('active')) {
      closePdf();
    } else if (currentSlug) {
      showHome();
    }
  }
});
