  --selection: rgba(255, 255, 255, 0.22);

html.light {

/* View Transition API Circular Wave */
::view-transition-old(root),
::view-transition-new(root) {
  animation: none;
  mix-blend-mode: normal;
}
::view-transition-old(root) {
  z-index: 1;
}
::view-transition-new(root) {
  z-index: 9999;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
::selection { background: var(--selection); }

html {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 14.5px;
  line-height: 1.68;

  background-color: var(--bg);
  scroll-behavior: smooth;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  min-height: 100vh;
  display: flex;
  flex-direction: column;

a {

}

.u-link {

  text-underline-offset: 3.5px;

}
.u-link:hover {
  text-decoration-color: var(--underline-hover);
  color: var(--fg);
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
  padding: 0;
}

.mono {

  font-size: 12px;
}

.serif-italic {
  font-family: "Newsreader", Georgia, serif;
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.01em;
}

/* Container */
.container {
  max-width: var(--max-w);
  width: 100%;
  margin: 0 auto;
  padding: 0 28px;
}

/* Header */
.header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s;
}
.header.scrolled {
  border-bottom-color: var(--border);
}
.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
}
.brand {
  font-size: 13px;
  font-weight: 500;
  color: var(--fg-muted);
  letter-spacing: -0.01em;
  transition: color 0.15s;
}
.brand:hover {
  color: var(--fg);
}
.nav-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Language Toggle */
.lang-toggle {
  display: inline-flex;
  align-items: center;
  padding: 2px;
  border-radius: 999px;
  border: 1px solid var(--border);
}
.lang-btn {
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 600;
  color: var(--fg-muted);
  transition: all 0.15s ease;
}
.lang-btn.active {
  background: var(--fg);
  color: var(--bg);
}

/* Theme Button */
.theme-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid var(--border);
  display: grid;
  place-items: center;
  color: var(--fg-muted);
  transition: all 0.15s ease;
}
.theme-btn:hover {
  color: var(--fg);
  border-color: var(--border-hover);
}
.theme-btn svg {
  width: 13px;
  height: 13px;
}

/* Main */
main {
  flex: 1;
  padding-top: 56px;
  padding-bottom: 100px;
}

/* Hero Section (Matching Paco Coursey's layout) */
.hero {
  margin-bottom: 60px;
}
.hero-name {

  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--fg);
  margin-bottom: 22px;

.hero-p2 {

  width: 14px;
  height: 9.5px;
  border-radius: 1.5px;
  overflow: hidden;
  margin: 0 2px;
}

/* 3-Column Asymmetric Layout (Paco's Building | Projects | Writing) */
.grid-3col {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  column-gap: 48px;
  row-gap: 48px;
}

.col-header {
  font-size: 13px;
  font-weight: 500;
  color: var(--fg-muted);
  margin-bottom: 26px;
  letter-spacing: -0.01em;
}

.item-group {
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.entry {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.entry-title {
  font-size: 14.5px;
  font-weight: 500;
  color: var(--fg);
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
}
.entry-desc {
  font-size: 13.5px;
  color: var(--fg-muted);
  line-height: 1.55;
}

/* Sub-heading within column */

  font-size: 13px;
  font-weight: 500;
  color: var(--fg-muted);
  margin-top: 14px;
  margin-bottom: 22px;
  letter-spacing: -0.01em;

/* ==============================================================
   THEME CONTROLLER (Silky Circular Ripple Wave)
   ============================================================== */
function applyTheme(t) {
  theme = t;
  localStorage.setItem('portfolio_theme', theme);
  const root = document.documentElement;
  const sun = document.getElementById('theme-sun');
  const moon = document.getElementById('theme-moon');

  if (theme === 'light') {
    root.classList.remove('dark');
    root.classList.add('light');
    if (sun) sun.style.display = 'none';
    if (moon) moon.style.display = 'block';
  } else {
    root.classList.remove('light');
    root.classList.add('dark');
    if (sun) sun.style.display = 'block';
    if (moon) moon.style.display = 'none';
  }
}

function toggleTheme(event) {
  const nextTheme = theme === 'dark' ? 'light' : 'dark';

  if (!document.startViewTransition || window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    applyTheme(nextTheme);
    return;
  }

  const btn = document.getElementById('theme-btn');
  let x, y;
  if (btn) {
    const rect = btn.getBoundingClientRect();
    x = rect.left + rect.width / 2;
    y = rect.top + rect.height / 2;
  } else if (event) {
    x = event.clientX;
    y = event.clientY;
  } else {
    x = window.innerWidth - 40;
    y = 30;
  }

  const endRadius = Math.hypot(
    Math.max(x, window.innerWidth - x),
    Math.max(y, window.innerHeight - y)
  );

  const transition = document.startViewTransition(() => {
    applyTheme(nextTheme);
  });

  transition.ready.then(() => {
    const clipPath = [
      `circle(0px at ${x}px ${y}px)`,
      `circle(${endRadius}px at ${x}px ${y}px)`
    ];
    document.documentElement.animate(
      {
        clipPath: clipPath
      },
      {
        duration: 750,
        easing: 'cubic-bezier(0.16, 1, 0.3, 1)',
        pseudoElement: '::view-transition-new(root)'
      }
    );
  });
}

/* ==============================================================
   PDF MODAL CONTROLLER
   ============================================================== */
const pdfModal = document.getElementById('pdf-modal');
const pdfFrame = document.getElementById('pdf-frame');
const pdfTitle = document.getElementById('pdf-title');
const pdfDirect = document.getElementById('pdf-direct');

function openPdf(file, title) {
  if (pdfTitle) pdfTitle.textContent = title;
  if (pdfFrame) pdfFrame.src = file;
  if (pdfDirect) pdfDirect.href = file;
  if (pdfModal) pdfModal.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closePdf() {
  if (pdfModal) pdfModal.classList.remove('active');
  if (pdfFrame) pdfFrame.src = '';
  document.body.style.overflow = '';
}

function handleOverlayClick(e) {
  if (e.target === pdfModal) closePdf();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && pdfModal && pdfModal.classList.contains('active')) {
    closePdf();
  }
});
