<style>
:root{--deep:#190d4b;--v:#5b2ff0;--v2:#8b5cf6;--lilac:#cdb9f5;--ink:#1c1733;--mut:#6f6b88;--soft:#f6f3ff;--line:#ece8f7;--W:1120px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:24px}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;color:var(--ink);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--v2);outline-offset:2px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important}}

/* banner */
.banner{position:relative;height:200px;background:var(--deep);overflow:hidden}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.bar{position:relative;z-index:2;max-width:var(--W);margin:0 auto;padding:22px 40px;display:flex;justify-content:space-between;align-items:center}
.lg{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:20px;letter-spacing:-.02em}
.lg i{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--v2),var(--v));display:grid;place-items:center;font-style:normal;font-size:15px}
.acts{display:flex;gap:8px}
.pill{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:9px 18px;font:700 13px "Plus Jakarta Sans",sans-serif;cursor:pointer}
.pill:hover{background:var(--soft)}

/* page */
.col{max-width:var(--W);margin:0 auto;padding:0 40px 130px}
.av{width:128px;height:128px;margin-top:-64px;border-radius:50%;border:6px solid #fff;background:var(--lilac);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:48px;color:var(--v);position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:14px}
h1{font-size:36px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.role{color:var(--mut);font-size:17px}
.soc{display:flex;gap:2px;margin:-4px -9px 0 0}
.soc a{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.soc a:hover{background:var(--soft);color:var(--v)}
.soc svg{width:22px;height:22px}
.bio{margin-top:16px;max-width:64ch;font-size:16.5px;color:#3f3b5a}
.stat{display:inline-flex;align-items:center;gap:7px;margin-top:14px;font-size:13px;font-weight:600;color:#0f7a4d}
.stat:before{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e}
.stack{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}
.stack span,.stk span{font-size:12.5px;font-weight:600;color:var(--mut);background:var(--soft);padding:3px 11px;border-radius:999px}

section{margin-top:84px}
h2{font-size:20px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
h2 small{font-size:12px;font-weight:700;color:var(--v);background:var(--soft);padding:1px 9px;border-radius:999px}

/* projects: list + stage */
.pjw{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:64px;align-items:start;margin-top:12px}
.pj{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px 0 16px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.pj:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:3px;background:transparent;transition:background .15s}
.pj.on:before{background:var(--v)}
.pj h3{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.3;transition:color .15s}
.pj p{font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{font-weight:800;color:var(--lilac);transition:transform .2s,color .2s}
.pj.on h3,.pj.on .ar{color:var(--v)}
.pj.on .ar{transform:translate(3px,-3px)}
.stage{position:sticky;top:28px;padding-top:16px}
.fade{animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
.win{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 24px 60px rgba(25,13,75,.12)}
.wb{display:flex;align-items:center;gap:6px;padding:11px 16px;background:#f6f4fb;border-bottom:1px solid var(--line)}
.wb i{width:10px;height:10px;border-radius:50%;background:var(--lilac)}
.url{margin-left:10px;flex:1;background:#fff;border-radius:999px;font-size:12px;color:var(--mut);padding:3px 14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.shot{position:relative;aspect-ratio:16/10;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2))}
.shot:before{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:28px solid rgba(255,255,255,.22)}
.shot:after{content:"";position:absolute;left:34px;bottom:-16px;border-left:58px solid transparent;border-right:58px solid transparent;border-bottom:96px solid rgba(255,255,255,.16);transform:rotate(-12deg)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;z-index:1}
.stage h3{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:22px}
.stage p{color:#4a4668;margin-top:6px;max-width:58ch}
.stk{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.go{display:inline-block;margin-top:16px;font-weight:700;font-size:14px;color:#fff;background:var(--v);padding:10px 20px;border-radius:999px}
.pv{display:none}

/* timeline as grid */
.tl{list-style:none;padding:26px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 64px}
.tl li{position:relative;border-top:2px solid var(--line);padding-top:16px}
.tl li:before{content:"";position:absolute;left:0;top:-2px;width:40px;height:2px;background:var(--v)}
.tl li.edu:before{background:var(--lilac)}
.tl li.hide{display:none}
.dt{font-size:12px;font-weight:700;color:var(--v)}
.dt .k{color:var(--mut);font-weight:600;margin-left:8px}
.tl h3{font-size:16px;font-weight:700;line-height:1.4;margin-top:2px}
.tl .pl{font-size:13px;color:var(--mut)}
.tl p{font-size:14px;color:#4a4668;margin-top:4px}
.more{margin-top:28px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 20px;font-weight:700;font-size:13px;color:var(--v);cursor:pointer}
.more:hover{background:var(--soft)}

/* certs */
.cts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 64px;padding-top:26px}
.ct{border-top:2px solid var(--line);padding-top:16px}
.ct span{font-size:12px;font-weight:700;color:var(--v)}
.ct b{display:block;font-size:16px;font-weight:700;line-height:1.4}
.ct small{color:var(--mut);font-size:13px}

/* contact */
.cta{position:relative;overflow:hidden;border-radius:30px;padding:48px;background:linear-gradient(135deg,var(--v2),var(--v));color:#fff;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.cta:before{content:"";position:absolute;left:-40px;bottom:-60px;width:170px;height:170px;border-radius:50%;border:32px solid rgba(255,255,255,.12)}
.cta>div{position:relative}
.cta h2{border:0;padding:0;font-size:34px;letter-spacing:-.03em;line-height:1.15}
.cta p{opacity:.9;margin-top:10px;max-width:40ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:999px;padding:7px 15px;font:600 13px "Plus Jakarta Sans",sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:#fff;color:var(--v);border-color:#fff}
.snd{display:flex;gap:8px;background:#fff;border-radius:20px;padding:7px 7px 7px 18px;align-items:flex-end}
.snd textarea{flex:1;border:0;outline:0;resize:none;font:500 14px "Plus Jakarta Sans",sans-serif;padding:9px 0;min-height:76px;color:var(--ink)}
.snd button{border:0;background:var(--v);color:#fff;font-weight:700;font-size:13px;padding:11px 20px;border-radius:14px;cursor:pointer}
footer{margin-top:44px;text-align:center;color:var(--mut);font-size:12.5px}

/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:2px;padding:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;box-shadow:0 10px 30px rgba(25,13,75,.14)}
.dock a{display:flex;align-items:center;gap:7px;padding:10px 15px;border-radius:999px;font-weight:700;font-size:13px;color:var(--mut);transition:background .15s,color .15s}
.dock a svg{width:19px;height:19px;flex:none}
.dock a:hover{color:var(--ink)}
.dock a.on{background:var(--v);color:#fff}

/* tablet + mobile */
@media(max-width:899px){
  .col,.bar{padding-left:22px;padding-right:22px}
  .banner{height:160px}
  .av{width:96px;height:96px;margin-top:-48px;font-size:38px}
  h1{font-size:28px}
  section{margin-top:64px}
  .pjw{grid-template-columns:1fr;gap:0}
  .stage{display:none}
  .pj{padding-left:0}
  .pj:before{display:none}
  .pj.open .pv{display:block;grid-column:1/-1;padding-top:10px}
  .pv .shot{border-radius:14px}
  .pv small{display:block;margin-top:10px;color:var(--mut);font-size:12.5px}
  .pv .go{margin-top:10px;padding:8px 16px;font-size:13px}
  .tl,.cts{grid-template-columns:1fr}
  .cta{grid-template-columns:1fr;padding:30px;gap:24px}
  .cta h2{font-size:26px}
}
@media(max-width:560px){
  .dock a span{display:none}
  .dock a.on span{display:inline}
  .dock a{padding:10px 13px}
}
</style>
</head>

  const p = projects[i], s = $("stage");
  s.innerHTML = `<div class="win"><div class="wb"><i></i><i></i><i></i><span class="url">${p[5] ? esc(p[5].replace(/^https?:\/\//,"")) : "link segera hadir"}</span></div>${shot(p,i)}</div><h3>${esc(p[2])}</h3><p>${esc(p[3])}</p><div class="stk">${chips(p)}</div>${p[5]?`<a class="go" href="${esc(p[5])}" target="_blank" rel="noopener">Buka proyek \u2197</a>`:""}`;
  s.classList.remove("fade"); void s.offsetWidth; s.classList.add("fade");
}
const box = $("projects");
if (desk) {
  pick(0);
  box.addEventListener("mouseover", e => { const r = e.target.closest(".pj"); if (r && !r.classList.contains("on")) pick(+r.dataset.i); });
  box.addEventListener("focusin", e => { const r = e.target.closest(".pj"); if (r && !r.classList.contains("on")) pick(+r.dataset.i); });
}
box.addEventListener("click", e => {
  const r = e.target.closest(".pj"); if (!r || e.target.closest("a")) return;
  if (desk) { if (r.dataset.url) window.open(r.dataset.url, "_blank", "noopener"); }
  else r.classList.toggle("open");
});
box.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList.contains("pj")) e.target.click(); });

/* perjalanan */
$("tl").innerHTML = timeline.map((t,i) => `<li class="${t[4]==="edu"?"edu":""}${i>=SHOW?" hide":""}"><div class="dt">${esc(t[0])}${t[4]==="edu"?'<span class="k">Pendidikan</span>':""}</div><h3>${esc(t[1])}</h3><div class="pl">${esc(t[2])}</div>${t[3]?`<p>${esc(t[3])}</p>`:""}</li>`).join("");
let expanded = false;
const setMore = () => { $("more").textContent = expanded ? "Ringkas" : `Tampilkan semua (${timeline.length})`; };
setMore();
$("more").onclick = () => { expanded = !expanded; document.querySelectorAll(".tl li").forEach((li,i) => li.classList.toggle("hide", !expanded && i >= SHOW)); setMore(); };
$("certs").innerHTML = certs.map(c => `<div class="ct"><span>${c[0]}</span><b>${esc(c[1])}</b><small>${esc(c[2])}</small></div>`).join("");

/* dock */
const menu = [["profil","Profil","home"],["proyek","Proyek","grid"],["perjalanan","Perjalanan","path"],["sertifikat","Sertifikat","badge"],["kontak","Kontak","chat"]];
$("dock").innerHTML = menu.map(m => `<a href="#${m[0]}" data-k="${m[0]}" aria-label="${m[1]}">${ico(m[2])}<span>${m[1]}</span></a>`).join("");
const links = [...document.querySelectorAll("#dock a")];
const setOn = id => links.forEach(a => a.classList.toggle("on", a.dataset.k === id));
setOn("profil");
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setOn(e.target.id); }), {rootMargin: "-45% 0px -50% 0px"});
menu.forEach(m => io.observe($(m[0])));

/* kontak */
$("chips").innerHTML = needs.map(n => `<button class="chip" type="button" aria-pressed="false">${esc(n)}</button>`).join("");
let need = "";
$("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  const on = c.getAttribute("aria-pressed") === "true";
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", "false"));
  c.setAttribute("aria-pressed", String(!on)); need = on ? "" : c.textContent;
});
$("send").onclick = () => {
  const t = $("txt").value.trim();
  const msg = "Halo Miftah, saya butuh " + (need || "bantuan proyek web") + "." + (t ? " " + t : "");
  window.open("https://wa.me/" + WA + "?text=" + encodeURIComponent(msg), "_blank", "noopener");
};
if (CV_URL) $("cv").href = CV_URL; else $("cv").style.display = "none";
$("share").onclick = async () => {
  try { navigator.share ? await navigator.share({title: document.title, url: location.href}) : (await navigator.clipboard.writeText(location.href), $("share").textContent = "Link disalin"); } catch(e){}
};
$("yr").textContent = new Date().getFullYear();
</script>
</body>
</html>
